spring.application.name=multiservice
server.port=8080

# Node identity (set by docker-compose per deployment)
app.node.vm-hostname=${VM_HOSTNAME:unknown-vm}
app.node.container-name=${CONTAINER_NAME:unknown-container}

# ---- NFS CSV ----
app.nfs.csv-path=${CSV_PATH:/data/people.csv}
app.nfs.page-size=${PAGE_SIZE:100}

# ---- DB (custom app settings) ----
app.db.page-size=${DB_PAGE_SIZE:100}

# ---- MySQL DataSource ----
spring.datasource.url=${DB_URL:jdbc:mysql://mvDataBase:3306/appdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Hikari (low-resource MVs) ----
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000